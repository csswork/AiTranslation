<style>body{margin:0;padding:20px;font:15px/1.6 system-ui}p{margin:0 0 10px}</style></head><body>
<div id="feed">
  <p class="item">First item loaded with the page.</p>
  <p class="item">Second item loaded with the page.</p>
</div>
<script>
const store = { domRules: { 'example.com': [
  { id:'r1', selector:'p.item', label:'p.item', createdAt: Date.now() } ] } };
const changeListeners = []; let msgListener = null;
window.__sent = [];
window.chrome = {
  runtime: { onMessage:{addListener:(f)=>{msgListener=f;}},
    sendMessage:(m)=>{ window.__sent.push(m);
      return m && m.type==='translate-batch'
        ? Promise.resolve({ok:true, texts:m.texts.map(t=>'[译]'+t)}) : Promise.resolve(); } },
  storage: { local:{ get:(k)=>Promise.resolve(k in store?{[k]:store[k]}:{}),
      set:(o)=>{Object.assign(store,o); changeListeners.forEach(f=>f({domRules:{}},'local')); return Promise.resolve();} },
    onChanged:{addListener:(f)=>changeListeners.push(f)} },
};
window.__buttons = () => { const l=[...document.body.children].find(e=>e.style&&e.style.zIndex==='2147483645');
  return l?[...l.children]:[]; };
window.__visibleButtons = () => window.__buttons().filter(h=>h.style.display!=='none').length;
// 模拟 ajax：往 feed 里追加匹配的节点
window.__ajaxAppend = (n, prefix) => {
  const feed = document.getElementById('feed');
  for (let i=0;i<n;i++){ const p=document.createElement('p'); p.className='item';
    p.textContent = prefix+' item '+i+' arrived later.'; feed.appendChild(p); }
};

<script>/**
 * 语言判定：决定「这段选中的文字是否需要翻译成中文」。
 *
 * 这个文件同时被三种环境加载：
 *   - content script（manifest 声明的普通脚本）
 *   - options / popup 页面（<script src>）
 *   - background service worker（`import`，即 ES module）
 * 所以它不能出现 import / export，只能把结果挂到 globalThis 上。
 */
(() => {
  // 汉字（含扩展区）。注意日文汉字也属于 Script=Han，所以要先排除假名。
  const HAN = /\p{Script=Han}/gu;
  const KANA = /[\p{Script=Hiragana}\p{Script=Katakana}]/u;
  const HANGUL = /\p{Script=Hangul}/u;
  const LETTER = /\p{L}/gu;

  /** 单次请求送给模型的最大字符数，超出部分会被截断。 */
  const MAX_TEXT_LENGTH = 6000;

  /** 汉字占全部字母的比例达到这个值，就认为「已经是中文了」。 */
  const CHINESE_RATIO = 0.5;

  function count(text, re) {
    const matched = text.match(re);
    return matched ? matched.length : 0;
  }

  /**
   * @param {string} raw
   * @returns {{text:string, letters:number, han:number, hasKana:boolean,
   *            hasHangul:boolean, chineseRatio:number, isChinese:boolean}}
   */
  function analyze(raw) {
    const text = String(raw == null ? '' : raw).trim();
    const letters = count(text, LETTER);
    const han = count(text, HAN);
    const hasKana = KANA.test(text);
    const hasHangul = HANGUL.test(text);
    const chineseRatio = letters > 0 ? han / letters : 0;
    // 含假名 → 日文；含谚文 → 韩文；两者都要翻译。
    const isChinese =
      !hasKana && !hasHangul && han > 0 && chineseRatio >= CHINESE_RATIO;
    return { text, letters, han, hasKana, hasHangul, chineseRatio, isChinese };
  }

  /** 是否应该在右键菜单里显示「翻译成中文」。 */
  function shouldOffer(raw) {
    const info = analyze(raw);
    if (!info.text) return false;
    if (info.letters === 0) return false; // 纯数字 / 标点 / emoji，没有翻译的意义
    return !info.isChinese;
  }

  globalThis.AITrLang = { analyze, shouldOffer, MAX_TEXT_LENGTH };
})();
</script><script>/**
 * 元素翻译规则：记住「某个域名下的哪些元素可以一键翻译」。
 *
 * 存在独立的 chrome.storage.local 键里，不进 settings——settings.normalize()
 * 会剥掉未知字段，两者混在一起迟早出事。
 *
 * 与 lang.js 一样，同时被内容脚本、service worker 和管理页加载，
 * 所以不能出现 import / export。
 */
(() => {
  const STORE_KEY = 'domRules';

  /** 单个域名下最多记多少条，避免误操作攒出一大堆。 */
  const MAX_RULES_PER_HOST = 50;

  const str = (v) => (typeof v === 'string' ? v.trim() : '');

  function newId() {
    return `r_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
  }

  /** 把任意存储内容整理成 { host: [rule, ...] }。 */
  function normalize(raw) {
    const input = raw && typeof raw === 'object' ? raw : {};
    const out = {};
    for (const [host, list] of Object.entries(input)) {
      if (!str(host) || !Array.isArray(list)) continue;
      const seen = new Set();
      const rules = [];
      for (const item of list) {
        if (!item || typeof item !== 'object') continue;
        const selector = str(item.selector);
        if (!selector || seen.has(selector)) continue;
        seen.add(selector);
        rules.push({
          id: str(item.id) || newId(),
          selector,
          label: str(item.label) || selector,
          createdAt: Number.isFinite(item.createdAt) ? item.createdAt : Date.now(),
        });
        if (rules.length >= MAX_RULES_PER_HOST) break;
      }
      if (rules.length) out[host] = rules;
    }
    return out;
  }

  async function loadRules() {
    const stored = await chrome.storage.local.get(STORE_KEY);
    return normalize(stored[STORE_KEY]);
  }

  async function saveRules(rules) {
    const clean = normalize(rules);
    await chrome.storage.local.set({ [STORE_KEY]: clean });
    return clean;
  }

  /** 取某个域名的规则。域名大小写不敏感，www. 视作同一个站点。 */
  function hostKey(host) {
    return str(host).toLowerCase().replace(/^www\./, '');
  }

  async function rulesFor(host) {
    const all = await loadRules();
    return all[hostKey(host)] || [];
  }

  async function addRule(host, selector, label) {
    const key = hostKey(host);
    const clean = str(selector);
    if (!key || !clean) return null;

    const all = await loadRules();
    const list = all[key] || [];
    const existing = list.find((item) => item.selector === clean);
    if (existing) return { rules: all, rule: existing, added: false };
    if (list.length >= MAX_RULES_PER_HOST) {
      return { rules: all, rule: null, added: false, full: true };
    }

    const rule = { id: newId(), selector: clean, label: str(label) || clean, createdAt: Date.now() };
    all[key] = [...list, rule];
    return { rules: await saveRules(all), rule, added: true };
  }

  async function removeRule(host, id) {
    const key = hostKey(host);
    const all = await loadRules();
    if (!all[key]) return all;
    all[key] = all[key].filter((item) => item.id !== id);
    if (!all[key].length) delete all[key];
    return saveRules(all);
  }

  async function removeHost(host) {
    const all = await loadRules();
    delete all[hostKey(host)];
    return saveRules(all);
  }

  async function clearAll() {
    await chrome.storage.local.set({ [STORE_KEY]: {} });
    return {};
  }

  globalThis.AITrRules = {
    STORE_KEY,
    MAX_RULES_PER_HOST,
    normalize,
    loadRules,
    saveRules,
    hostKey,
    rulesFor,
    addRule,
    removeRule,
    removeHost,
    clearAll,
  };
})();
</script><script>/**
 * 为右键选中的元素生成一个可复用的 CSS 选择器。
 *
 * 目标不是「精确定位这一个节点」，而是「下次访问这个站点时还能匹配到同类元素」。
 * 所以要避开框架生成的随机类名，也要避免过于宽泛而匹配到满页元素。
 *
 * 不能出现 import / export（内容脚本与管理页都要用）。
 */
(() => {
  /** 匹配数量超过这个值就认为太宽泛，需要再加限定。 */
  const MAX_MATCHES = 40;
  const MAX_CLASSES = 3;
  const MAX_ANCESTORS = 3;

  /**
   * 构建工具生成的类名下次访问就变了，不能拿来记规则。
   * 例如 css-1a2b3c、sc-bdVaJa、Button__root___2xYz。
   */
  const UNSTABLE = [
    // 前缀 + 哈希：css-1a2b3c。后缀必须字母数字混杂才算哈希，
    // 否则会误杀 main-content、post-title 这类最常见的稳定命名。
    /^[a-z]+[-_](?=[a-z0-9]*\d)(?=[a-z0-9]*[a-z])[a-z0-9]{5,}$/i,
    // CSS-in-JS 的固定前缀 + 长后缀：sc-bdVaJa（这种后缀不含数字，上一条抓不到）
    /^(css|sc|jsx|emotion|styled|svelte)-[a-z0-9]{5,}$/i,
    // CSS Modules：Button__root___2xYz
    /__[0-9a-z]{4,}$/i,
    /--[0-9a-z]{5,}$/i,
    // 自动生成的 id：ember1234
    /^[a-z-]*[a-z]\d{3,}$/i,
    // 前缀 + 纯数字序号：radix-3421、item-1024
    /^[a-z]+[-_]\d{3,}$/i,
    /\d{5,}/,
  ];

  const isStable = (name) =>
    typeof name === 'string' &&
    name.length > 1 &&
    name.length <= 40 &&
    !UNSTABLE.some((re) => re.test(name));

  const esc = (value) =>
    globalThis.CSS && typeof CSS.escape === 'function'
      ? CSS.escape(value)
      : String(value).replace(/[^\w-]/g, '\\$&');

  /** 一个元素自身的候选选择器，由具体到宽泛。 */
  function ownCandidates(el) {
    const tag = el.tagName.toLowerCase();
    const list = [];

    const id = el.getAttribute('id');
    if (isStable(id)) list.push(`#${esc(id)}`);

    // 部分站点用 data-testid 之类的稳定属性，比类名更可靠
    for (const attr of ['data-testid', 'data-test', 'data-qa', 'itemprop', 'role']) {
      const value = el.getAttribute(attr);
      if (isStable(value)) list.push(`${tag}[${attr}="${value.replace(/"/g, '\\"')}"]`);
    }

    const classes = [...el.classList].filter(isStable).slice(0, MAX_CLASSES);
    // 多个类名 → 先试全部（较窄），再试首个（较宽，更容易命中同类元素）
    if (classes.length > 1) list.push(tag + classes.map((c) => `.${esc(c)}`).join(''));
    if (classes.length) list.push(`${tag}.${esc(classes[0])}`);

    list.push(tag);
    return list;
  }

  /** 从近到远的祖先限定词。 */
  function ancestorChain(el) {
    const chain = [];
    let node = el.parentElement;
    const doc = el.ownerDocument;
    while (node && node !== doc.documentElement && chain.length < MAX_ANCESTORS) {
      const [best] = ownCandidates(node);
      // 只有带 id / 属性 / 类名的祖先才有限定价值，光一个标签名没意义
      if (best && !/^[a-z]+$/.test(best)) chain.push(best);
      node = node.parentElement;
    }
    return chain;
  }

  /** 兜底：结构化路径。唯一，但页面一改版就失效。 */
  function structuralPath(el) {
    const parts = [];
    let node = el;
    const doc = el.ownerDocument;
    while (node && node.nodeType === 1 && node !== doc.body && parts.length < 6) {
      const tag = node.tagName.toLowerCase();
      const parent = node.parentElement;
      if (!parent) {
        parts.unshift(tag);
        break;
      }
      const sameTag = [...parent.children].filter((c) => c.tagName === node.tagName);
      parts.unshift(sameTag.length > 1 ? `${tag}:nth-of-type(${sameTag.indexOf(node) + 1})` : tag);
      node = parent;
    }
    return parts.length ? `body ${parts.join(' > ')}` : null;
  }

  function countMatches(doc, selector) {
    try {
      return doc.querySelectorAll(selector).length;
    } catch {
      return -1; // 选择器不合法
    }
  }

  function matchesSelf(el, selector) {
    try {
      return el.matches(selector);
    } catch {
      return false;
    }
  }

  /**
   * @returns {{selector: string, label: string, matches: number} | null}
   */
  function build(el) {
    if (!el || el.nodeType !== 1) return null;
    const doc = el.ownerDocument;
    if (!doc) return null;

    const owns = ownCandidates(el);
    const chain = ancestorChain(el);

    // 候选顺序：先试元素自身（更宽、更容易复用到同类元素），
    // 太宽泛时再逐级加上祖先限定。
    const candidates = [];
    for (const own of owns) {
      // 光一个标签名（如 span）当规则太弱，先试带祖先限定的版本，
      // 实在不行再退回裸标签名。
      const bare = /^[a-z]+$/.test(own);
      if (!bare) candidates.push(own);
      let prefix = '';
      for (const ancestor of chain) {
        prefix = prefix ? `${ancestor} ${prefix}` : ancestor;
        candidates.push(`${prefix} ${own}`);
      }
      if (bare) candidates.push(own);
    }

    for (const selector of candidates) {
      if (!matchesSelf(el, selector)) continue;
      const count = countMatches(doc, selector);
      if (count >= 1 && count <= MAX_MATCHES) {
        return { selector, label: describe(el), matches: count };
      }
    }

    const fallback = structuralPath(el);
    if (fallback && matchesSelf(el, fallback)) {
      return { selector: fallback, label: describe(el), matches: countMatches(doc, fallback) };
    }
    return null;
  }

  /** 给管理界面看的简短描述。 */
  function describe(el) {
    const tag = el.tagName.toLowerCase();
    const id = el.getAttribute('id');
    const classes = [...el.classList].filter(isStable).slice(0, 2);
    let label = tag;
    if (isStable(id)) label += `#${id}`;
    else if (classes.length) label += `.${classes.join('.')}`;
    else {
      for (const attr of ['data-testid', 'data-test', 'data-qa', 'itemprop']) {
        const value = el.getAttribute(attr);
        if (isStable(value)) {
          label += `[${value}]`;
          break;
        }
      }
    }
    const text = (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40);
    return text ? `${label} · ${text}${text.length >= 40 ? '…' : ''}` : label;
  }

  globalThis.AITrSelector = { build, describe, isStable, MAX_MATCHES };
})();
</script><script>/**
 * 元素翻译：右键某个元素 → 给它挂一个翻译按钮 → 点击把元素内的文字就地换成中文。
 * 规则按域名记住，下次访问自动挂上按钮。
 *
 * 独立于 content.js（划词翻译那套）：自己的事件监听、自己的 shadow 宿主，
 * 互不引用，一边出问题不影响另一边。
 */
(() => {
  if (window.__aiTranslationElementsLoaded) return;
  window.__aiTranslationElementsLoaded = true;

  // 只在顶层框架工作：iframe 里挂按钮意义不大，也容易错位
  try {
    if (window.top !== window) return;
  } catch {
    return;
  }

  const Lang = globalThis.AITrLang;
  const Rules = globalThis.AITrRules;
  const Selector = globalThis.AITrSelector;
  if (!Lang || !Rules || !Selector) return;

  /** 不该翻译、也不该计入语言判定的标签。 */
  const SKIP_TAGS = new Set([
    'SCRIPT', 'STYLE', 'NOSCRIPT', 'TEXTAREA', 'INPUT', 'SELECT', 'OPTION',
    'CODE', 'PRE', 'KBD', 'SAMP', 'SVG', 'CANVAS', 'IFRAME',
  ]);

  const MAX_ELEMENTS_PER_RULE = 20; // 一条规则最多挂多少个按钮
  const MAX_NODES = 300;            // 单个元素最多翻译多少段
  const MAX_CHARS = 20000;          // 单个元素最多翻译多少字
  const CHUNK_NODES = 25;           // 每批送多少段
  const CHUNK_CHARS = 2200;         // 每批最多多少字

  const HOST = 'example.com'; // harness

  async function ask(message) {
    try {
      return await chrome.runtime.sendMessage(message);
    } catch (err) {
      return { ok: false, error: String(err?.message || err) };
    }
  }

  /* ------------------------------------------------------- 右键目标追踪 */

  /**
   * 只需要记住右键点的是哪个元素。
   * 菜单项是否出现完全交给 Chrome 的 contexts 规则（见 background.js），
   * 这里不做任何判断，也不用上报——省掉了一条会出时序问题的链路。
   */
  let lastTarget = null;

  document.addEventListener(
    'contextmenu',
    (event) => {
      const target = event.target;
      if (!(target instanceof Element)) return;
      // 右键点在我们自己的按钮上时不算
      if (layer && layer.contains(target)) return;
      lastTarget = target;
    },
    true
  );

  /* ----------------------------------------------------------- 按钮 UI */

  const BUTTON_STYLE = `
    .btn {
      all: unset;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 8px;
      border-radius: 6px;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
      opacity: 0.92;
    }
    .btn:hover { opacity: 1; }
    .btn[data-state="busy"] { cursor: progress; }
    .btn[data-state="done"] {
      background: rgba(15, 23, 42, 0.62);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
    }
    .btn[data-state="error"] { background: #b42318; }`;

  let layer = null;

  function ensureLayer() {
    if (layer && layer.isConnected) return layer;
    layer = document.createElement('div');
    layer.style.cssText =
      'all: initial; position: absolute !important; top: 0 !important; left: 0 !important;' +
      'width: 0 !important; height: 0 !important; pointer-events: none !important;' +
      'z-index: 2147483645 !important;';
    (document.body || document.documentElement).appendChild(layer);
    return layer;
  }

    const rect = entry.element.getBoundingClientRect();

      return;

    const top = rect.top + window.scrollY;
    const left = rect.right + window.scrollX;
    entry.host.style.top = `${Math.round(Math.max(0, top + 2))}px`;
    entry.host.style.left = `${Math.round(Math.max(0, left - 8))}px`;
  }

  function setState(entry, state, text) {
    entry.state = state;
    entry.button.dataset.state = state;
    entry.button.textContent = text;
  }

  function attach(element) {
    if (!(element instanceof Element) || attached.has(element)) return;

    const host = document.createElement('div');
    host.style.cssText =
      'all: initial; position: absolute !important; pointer-events: auto !important;' +
      'transform: translateX(-100%) !important;';
    const root = host.attachShadow({ mode: 'open' });
    const style = document.createElement('style');
    style.textContent = BUTTON_STYLE;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn';
    button.title = '把这个区域的文字翻译成中文';
    button.textContent = '译';
    button.dataset.state = 'idle';
    root.appendChild(style);
    root.appendChild(button);

    const entry = { element, host, button, state: 'idle', originals: null };
    attached.set(element, entry);
    ensureLayer().appendChild(host);
    position(entry);

    button.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      onButtonClick(entry);
    });

    // 元素尺寸变化时跟着挪
    try {
      const observer = new ResizeObserver(() => position(entry));
      observer.observe(element);
      entry.observer = observer;
    } catch {
      /* 老浏览器没有 ResizeObserver，靠 resize 事件兜底 */
    }
    return entry;
  }

  let repositionTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(repositionTimer);
    repositionTimer = setTimeout(() => {
      for (const element of trackedElements) {
        const entry = attached.get(element);
        if (entry) position(entry);
      }
    }, 150);
  });

  /** WeakMap 不能遍历，另外留一份普通集合用于重新定位。 */
  const trackedElements = new Set();

  /* ------------------------------------------------------- 收集与替换 */

  function collectTextNodes(element) {
    const nodes = [];
    let chars = 0;
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const parent = node.parentElement;
        if (!parent || SKIP_TAGS.has(parent.tagName)) return NodeFilter.FILTER_REJECT;
        const value = node.nodeValue || '';
        if (!value.trim()) return NodeFilter.FILTER_REJECT;
        // 没有字母的（纯数字、符号）不值得送去翻译
        return /\p{L}/u.test(value) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      },
    });
    while (walker.nextNode()) {
      const node = walker.currentNode;
      const value = node.nodeValue;
      if (nodes.length >= MAX_NODES || chars + value.length > MAX_CHARS) break;
      nodes.push(node);
      chars += value.length;
    }
    return nodes;
  }

  /** 按字数和条数切批。 */
  function chunk(nodes) {
    const batches = [];
    let current = [];
    let chars = 0;
    for (const node of nodes) {
      const length = node.nodeValue.length;
      if (current.length && (current.length >= CHUNK_NODES || chars + length > CHUNK_CHARS)) {
        batches.push(current);
        current = [];
        chars = 0;
      }
      current.push(node);
      chars += length;
    }
    if (current.length) batches.push(current);
    return batches;
  }

  async function translateElement(entry) {
    const nodes = collectTextNodes(entry.element);
    if (!nodes.length) {
      setState(entry, 'error', '无文字');
      setTimeout(() => setState(entry, 'idle', '译'), 1600);
      return;
    }

    const originals = nodes.map((node) => ({ node, text: node.nodeValue }));
    const batches = chunk(nodes);
    let done = 0;

    setState(entry, 'busy', `0/${batches.length}`);

    for (const batch of batches) {
      const texts = batch.map((node) => node.nodeValue);
      const reply = await ask({ type: 'translate-batch', texts });
      if (!reply?.ok) {
        // 已经换掉的部分保留，按钮上给出错误
        entry.originals = originals;
        setState(entry, 'error', '失败');
        entry.button.title = reply?.error || '翻译失败';
        return;
      }
      batch.forEach((node, index) => {
        const translated = reply.texts[index];
        if (typeof translated === 'string' && translated) node.nodeValue = translated;
      });
      done += 1;
      setState(entry, 'busy', `${done}/${batches.length}`);
      position(entry);
    }

    entry.originals = originals;
    entry.button.title = '恢复原文';
    setState(entry, 'done', '原文');
    position(entry);
  }

  function restoreElement(entry) {
    if (entry.originals) {
      for (const item of entry.originals) {
        // 节点可能已被页面自身替换掉
        if (item.node.isConnected) item.node.nodeValue = item.text;
      }
    }
    entry.originals = null;
    entry.button.title = '把这个区域的文字翻译成中文';
    setState(entry, 'idle', '译');
    position(entry);
  }

  function onButtonClick(entry) {
    if (entry.state === 'busy') return;
    if (entry.state === 'done') {
      restoreElement(entry);
      return;
    }
    translateElement(entry).catch((err) => {
      setState(entry, 'error', '失败');
      entry.button.title = String(err?.message || err);
    });
  }

  /* --------------------------------------------------------- 规则应用 */

  let activeRules = [];

  function applyRules() {
    for (const rule of activeRules) {
      let matched;
      try {
        matched = document.querySelectorAll(rule.selector);
      } catch {
        continue; // 选择器失效（站点改版）就跳过
      }
      let count = 0;
      for (const element of matched) {
        if (count >= MAX_ELEMENTS_PER_RULE) break;
        count += 1;
        if (attached.has(element)) continue;
        if (attach(element)) trackedElements.add(element);
      }
    }
  }

  async function reloadRules() {
    try {
      activeRules = await Rules.rulesFor(HOST);
    } catch {
      activeRules = [];
    }
    applyRules();
  }

  /* 页面内容是后加载的（SPA、无限滚动）时也要能挂上按钮 */
  let observerTimer = 0;
  function watchDom() {
    try {
      const observer = new MutationObserver(() => {
        if (!activeRules.length || observerTimer) return;
        observerTimer = setTimeout(() => {
          observerTimer = 0;
          applyRules();
        }, 800);
      });
      observer.observe(document.body, { childList: true, subtree: true });
    } catch {
      /* 忽略 */
    }
  }

  /* ----------------------------------------------------------- 消息 */

  chrome.runtime.onMessage.addListener((message, _sender, sendResponse) => {
    if (message?.type !== 'add-element-rule') return false;
    (async () => {
      if (!lastTarget || !lastTarget.isConnected) {
        sendResponse({ ok: false, error: '没有记录到右键的元素' });
        return;
      }
      const built = Selector.build(lastTarget);
      if (!built) {
        sendResponse({ ok: false, error: '无法为这个元素生成可复用的选择器' });
        return;
      }
      const result = await Rules.addRule(HOST, built.selector, built.label);
      // 拿不到域名（file://、about:blank 等）时无法记录规则，
      // 这里必须如实报错，不能假装成功让用户以为没生效是别的原因
      if (!result) {
        sendResponse({ ok: false, error: '这个页面没有有效域名，无法记录规则' });
        return;
      }
      if (result.full) {
        sendResponse({ ok: false, error: '这个网站的规则已达上限' });
        return;
      }
      await reloadRules();
      sendResponse({ ok: true, selector: built.selector, matches: built.matches });
    })();
    return true; // 异步回复
  });

  chrome.storage.onChanged.addListener((changes, area) => {
    if (area === 'local' && changes[Rules.STORE_KEY]) reloadRules();
  });

  /* ---------------------------------------------------------- 启动 */

  reloadRules();
  watchDom();
})();
</script>
</body></html>
