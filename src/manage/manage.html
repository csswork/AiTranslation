<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>元素翻译规则 · AI 划词翻译</title>
    <link rel="stylesheet" href="manage.css" />
  </head>
  <body>
    <main class="page">
      <header class="head">
        <img class="mark" src="../../icons/icon128.png" alt="" />
        <div class="titles">
          <h1>元素翻译规则</h1>
          <p class="sub">
            在网页上右键某个区域 → 选「为这个区域添加翻译按钮」，规则会记录在这里；
            下次访问同一网站时，匹配到的区域会自动带上翻译按钮。
          </p>
        </div>
        <button id="options" class="btn ghost small" type="button">设置</button>
      </header>

      <div class="bar">
        <span class="count" id="count"></span>
        <button id="clearAll" class="btn ghost small" type="button">清空全部</button>
      </div>

      <div id="list" class="list"></div>

      <div id="empty" class="empty" hidden>
        <p class="empty-title">还没有任何规则</p>
        <p class="empty-body">
          打开一个非中文网页，在想翻译的区域上点右键，选择「为这个区域添加翻译按钮」即可。
        </p>
      </div>
    </main>

    <script src="../lib/rules.js"></script>
    <script src="manage.js"></script>
  </body>
</html>
