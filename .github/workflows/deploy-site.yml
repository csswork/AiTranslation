# 把 docs/ 下的宣传站发布到 Vercel。
#
# 只在站点相关文件变动时触发——改扩展源码（src/）不会触发部署。
# vercel.json 里关掉了 Vercel 自己的 Git 集成，发布口径只有这一个工作流，
# 不会出现「推一次部署两遍」。
#
# 需要三个仓库 Secret：VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'vercel.json'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'vercel.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 检查 Secrets 是否齐全
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?缺少仓库 Secret: VERCEL_TOKEN}"
          : "${VERCEL_ORG_ID:?缺少仓库 Secret: VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?缺少仓库 Secret: VERCEL_PROJECT_ID}"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 不锁小版本；万一哪天 CLI 发版把构建弄挂了，把 latest 换成具体版本号即可
      - name: 安装 Vercel CLI
        run: npm install --global vercel@latest

      - name: 确定发布环境
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "env=preview"     >> "$GITHUB_OUTPUT"
            echo "prod="           >> "$GITHUB_OUTPUT"
          else
            echo "env=production"  >> "$GITHUB_OUTPUT"
            echo "prod=--prod"     >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取 Vercel 项目配置
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token="$VERCEL_TOKEN"

      - name: 构建
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build ${{ steps.target.outputs.prod }} --token="$VERCEL_TOKEN"

      - name: 部署
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### 部署完成"
            echo ""
            echo "环境：\`${{ steps.target.outputs.env }}\`"
            echo ""
            echo "地址：$url"
          } >> "$GITHUB_STEP_SUMMARY"
