<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 划词翻译</title>
    <style>
      :root {
        --bg: #f6f7fb; --card: #fff; --text: #0f172a; --muted: rgba(15, 23, 42, 0.6);
        --line: rgba(15, 23, 42, 0.1); --accent: #4f46e5; --warn: #b45309;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121318; --card: #191b21; --text: #e9eaee; --muted: rgba(233, 234, 238, 0.6);
          --line: rgba(255, 255, 255, 0.1); --accent: #818cf8; --warn: #fbbf24;
        }
      }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        background: var(--bg); color: var(--text);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main {
        width: min(360px, 100%); padding: 28px 24px; text-align: center; box-sizing: border-box;
        background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      }
      img { display: block; margin: 0 auto 12px; }
      h1 { margin: 0 0 6px; font-size: 17px; }
      p { margin: 0; color: var(--muted); }
      p.error { color: var(--warn); }
      a { display: inline-block; margin-top: 14px; color: var(--accent); text-decoration: none; font-weight: 600; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <img src="../../icons/icon48.png" alt="" width="48" height="48" />
      <h1>AI 划词翻译</h1>
      <p id="state" role="status" aria-live="polite">正在连接…</p>
      <a id="back" href="../options/options.html" hidden>设置</a>
    </main>
    <script src="../lib/languages.js"></script>
    <script src="../lib/messages.js"></script>
    <script src="../lib/i18n.js"></script>
    <script src="callback.js"></script>
  </body>
</html>
