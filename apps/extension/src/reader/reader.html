<!doctype html>
<html lang="zh-CN" data-theme="auto" data-font="sans" data-width="medium" data-dim="none">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>双语阅读 · AI 划词翻译</title>
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body class="mode-side">
    <header class="bar" id="bar">
      <a class="brand" id="source" target="_blank" rel="noopener noreferrer" title="打开原网页">
        <img class="mark" src="../../icons/icon48.png" alt="" />
        <span class="site" id="site">双语阅读</span>
      </a>
      <p class="status" id="status" aria-live="polite"></p>
      <div class="tools">
        <div class="seg" id="modes" role="group" aria-label="显示方式">
          <button type="button" data-mode="side" aria-pressed="true" title="原文与译文左右并排">并排</button>
          <button type="button" data-mode="stack" aria-pressed="false" title="每段原文下面紧跟译文">上下</button>
          <button type="button" data-mode="translated" aria-pressed="false">译文</button>
          <button type="button" data-mode="original" aria-pressed="false">原文</button>
        </div>
        <select id="target" title="目标语言" aria-label="目标语言"></select>
        <select id="provider" title="平台" aria-label="平台"></select>
        <button id="run" class="btn" type="button" hidden>停止</button>
        <button id="styleButton" class="icon-btn" type="button" title="阅读样式" aria-label="阅读样式" aria-expanded="false" aria-controls="panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18 8.6 5h1.3L15 18M5.4 13.4h7.7" /><path d="M16.2 10.6c.6-.9 1.6-1.4 2.7-1.4 1.8 0 2.8 1 2.8 2.9V18m0-3.9c-1 .1-5.4-.3-5.4 2.1 0 1.3 1 1.9 2.2 1.9 1.6 0 3.2-1.1 3.2-3.3" /></svg>
        </button>
      </div>
      <div class="progress" id="progressWrap" hidden><div class="progress-bar" id="progress"></div></div>
    </header>

    <div class="panel" id="panel" role="dialog" aria-label="阅读样式" hidden>
      <div class="field">
        <span class="field-label">主题</span>
        <div class="themes" id="themes">
          <button type="button" data-value="auto" title="跟随系统的浅色或深色"><span class="sw auto"></span><span>自动</span></button>
          <button type="button" data-value="paper"><span class="sw paper"></span><span>纸色</span></button>
          <button type="button" data-value="white"><span class="sw white"></span><span>白色</span></button>
          <button type="button" data-value="sepia"><span class="sw sepia"></span><span>米黄</span></button>
          <button type="button" data-value="green"><span class="sw green"></span><span>护眼</span></button>
          <button type="button" data-value="night"><span class="sw night"></span><span>夜间</span></button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">字体</span>
        <div class="seg wide" data-pref="font">
          <button type="button" data-value="sans">无衬线</button>
          <button type="button" data-value="serif">衬线</button>
          <button type="button" data-value="kai">楷体</button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">字号</span>
        <div class="slider">
          <button type="button" class="step" data-target="size" data-step="-1" aria-label="减小字号">A</button>
          <input type="range" id="size" min="13" max="26" step="1" aria-label="字号" />
          <button type="button" class="step big" data-target="size" data-step="1" aria-label="增大字号">A</button>
          <output id="sizeOut" for="size"></output>
        </div>
      </div>
      <div class="field">
        <span class="field-label">行距</span>
        <div class="slider">
          <button type="button" class="step" data-target="leading" data-step="-0.05" aria-label="减小行距">−</button>
          <input type="range" id="leading" min="1.4" max="2.4" step="0.05" aria-label="行距" />
          <button type="button" class="step" data-target="leading" data-step="0.05" aria-label="增大行距">+</button>
          <output id="leadingOut" for="leading"></output>
        </div>
      </div>
      <div class="field">
        <span class="field-label">版心</span>
        <div class="seg wide" data-pref="width">
          <button type="button" data-value="narrow">窄</button>
          <button type="button" data-value="medium">适中</button>
          <button type="button" data-value="wide">宽</button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">淡化</span>
        <div class="seg wide" data-pref="dim">
          <button type="button" data-value="none">不淡化</button>
          <button type="button" data-value="original">原文</button>
          <button type="button" data-value="translated">译文</button>
        </div>
      </div>
      <div class="panel-foot">
        <button type="button" class="link" id="reset">恢复默认</button>
        <button type="button" class="link" id="settings">翻译设置</button>
      </div>
    </div>

    <div class="error" id="error" hidden><p id="errorText"></p></div>

    <div class="alt" id="alt" role="dialog" aria-label="其他译法" hidden>
      <p class="alt-head"><span class="alt-picked" id="altPicked"></span><span class="alt-source" id="altSource"></span></p>
      <div class="alt-list" id="altList" role="listbox" aria-label="其他译法"></div>
      <p class="alt-msg" id="altMsg" aria-live="polite"></p>
      <form class="alt-own" id="altOwn">
        <input id="altInput" type="text" maxlength="200" placeholder="自己改写…" aria-label="自己改写" autocomplete="off" />
        <button type="submit" class="btn">替换</button>
      </form>
      <button type="button" class="link alt-restore" id="altRestore" hidden>恢复这一段的原译文</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span id="toastText"></span>
      <button type="button" class="link" id="toastAction"></button>
      <button type="button" class="toast-close" id="toastClose" aria-label="关闭">×</button>
    </div>

    <main class="doc" id="doc" hidden>
      <header class="head">
        <p class="meta" id="meta"></p>
        <div class="pair title-pair" id="titlePair"></div>
      </header>
      <div class="body" id="body"></div>
      <footer class="end">
        <span class="end-mark" aria-hidden="true"></span>
        <p class="end-note" id="endNote"></p>
      </footer>
    </main>

    <section class="empty" id="empty" hidden>
      <h1>这篇文章已经不在了</h1>
      <p>阅读内容只保存在当前浏览器会话里。请回到原网页，在空白处右键选择「双语阅读这篇文章」重新打开。</p>
    </section>

    <script src="../lib/languages.js"></script>
    <script src="../lib/messages.js"></script>
    <script src="../lib/i18n.js"></script>
    <script src="../lib/lang.js"></script>
    <script src="../lib/settings.js"></script>
    <script src="../lib/providers.js"></script>
    <script src="../lib/article.js"></script>
    <script src="reader.js"></script>
  </body>
</html>
