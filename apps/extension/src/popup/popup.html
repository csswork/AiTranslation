<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AI 划词翻译</title>
    <style>
      :root {
        --bg: #fff; --text: #0f172a; --muted: rgba(15, 23, 42, 0.55);
        --faint: rgba(15, 23, 42, 0.38); --line: rgba(15, 23, 42, 0.1);
        --accent: #4f46e5; --accent-soft: rgba(79, 70, 229, 0.08);
        --ok: #15803d; --warn: #b45309;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191b21; --text: #e9eaee; --muted: rgba(233, 234, 238, 0.6);
          --faint: rgba(233, 234, 238, 0.4); --line: rgba(255, 255, 255, 0.1);
          --accent: #818cf8; --accent-soft: rgba(129, 140, 248, 0.14);
          --ok: #4ade80; --warn: #fbbf24;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 268px; margin: 0; padding: 14px;
        background: var(--bg); color: var(--text);
        font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .head { display: flex; align-items: center; gap: 9px; }
      .mark { width: 26px; height: 26px; flex: none; }
      .name { font-size: 13.5px; font-weight: 620; }
      .steps {
        margin: 12px 0 0; padding: 10px 12px;
        background: var(--accent-soft); border-radius: 10px;
        font-size: 12px; color: var(--muted);
      }
      .steps b { color: var(--text); font-weight: 560; }
      .row {
        display: flex; align-items: center; gap: 8px;
        margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
      }
      .row:first-of-type { border-top: 0; }
      .row .label { font-size: 12px; color: var(--muted); flex: 1 1 auto; }
      select {
        font: inherit; font-size: 12px; color: inherit; cursor: pointer;
        padding: 4px 7px; border-radius: 7px;
        border: 1px solid var(--line); background: transparent;
      }
      .state { font-size: 11.5px; }
      .state.ok { color: var(--ok); }
      .state.warn { color: var(--warn); }
      button.btn {
        width: 100%; margin-top: 8px; font: inherit; font-size: 12.5px; font-weight: 530;
        padding: 8px; border-radius: 9px; cursor: pointer;
        color: #fff; background: var(--accent); border: 0;
      }
      button.btn:hover { filter: brightness(1.06); }
      button.btn.ghost {
        color: var(--accent); background: transparent; border: 1px solid var(--line);
      }
      button.btn.ghost:hover { background: var(--accent-soft); filter: none; }
      .hint { margin: 9px 0 0; font-size: 11px; color: var(--faint); text-align: center; }
      [hidden] { display: none !important; }
      /* 账户：已登录显示首字母圆标、用户名、试用 / 订阅与剩余点数；未登录显示注册引导按钮 */
      :root { --gradient: linear-gradient(135deg, #5b5eea, #9747ec); }
      @media (prefers-color-scheme: dark) { :root { --gradient: linear-gradient(135deg, #6d70f5, #a855f7); } }
      .account { margin-top: 12px; }
      .account-in {
        display: flex; align-items: center; gap: 9px; padding: 9px 10px;
        border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
        background: transparent; width: 100%; font: inherit; color: inherit; text-align: start;
      }
      .account-in:hover { background: var(--accent-soft); }
      .avatar {
        flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
        background: var(--gradient); color: #fff; font-size: 12px; font-weight: 700;
      }
      .avatar.guest { background: var(--bg); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); font-size: 13px; }
      .who { display: grid; min-width: 0; flex: 1; }
      .who b { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .who span { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .credits {
        font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
        background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .credits.empty { background: none; color: var(--warn); }
      button.btn.gradient { background: var(--gradient); margin-top: 0; }
    </style>
  </head>
  <body>
    <div class="head">
      <img class="mark" src="../../icons/icon128.png" alt="" />
      <div class="name">AI 划词翻译</div>
    </div>

    <div class="account">
      <button class="account-in" id="accountIn" type="button" hidden>
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="who"><b id="username"></b><span id="accountMeta"></span></span>
        <b class="credits" id="credits"></b>
      </button>
      <button id="login" class="btn gradient" type="button" hidden>登录 / 注册</button>
    </div>

    <p class="steps" id="targetName"></p>

    <div class="row">
      <span class="label">翻译平台</span>
      <select id="provider"></select>
    </div>
    <div class="row" id="modelRow">
      <span class="label">当前模型</span>
      <span class="state" id="model">—</span>
    </div>
    <div class="row" id="keyRow" hidden>
      <span class="label">API Key</span>
      <span class="state" id="keyState">—</span>
    </div>

    <button id="panel" class="btn ghost" type="button">打开翻译面板</button>
    <button id="image" class="btn ghost" type="button">图片翻译</button>
    <!-- 实验功能，默认关闭：popup.js 按设置决定显不显示 -->
    <button id="video" class="btn ghost" type="button" hidden title="给当前页面的视频开 / 关实时字幕">视频实时字幕</button>
    <button id="open" class="btn" type="button">打开设置</button>
    <p class="hint">任何语言的文字都可以翻译，包括中文。</p>

    <script src="../lib/languages.js"></script>
    <script src="../lib/messages.js"></script>
    <script src="../lib/i18n.js"></script>
    <script src="../lib/env.js"></script>
    <script src="../lib/credits.js"></script>
    <script src="../lib/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
