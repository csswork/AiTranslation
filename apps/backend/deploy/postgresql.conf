# /etc/postgresql/18/main/conf.d/huaci.conf（由 deploy/setup-server.sh 安装）
# 本机数据库只给同机的后端用：只开 Unix socket，不监听任何 TCP 地址。
# 机器 4G 内存、与其他服务共用，按此留出余量。
listen_addresses = ''
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 64MB
# 每次提交都落盘（默认值，写在这里防止被误改）：账本与订单不能丢已确认的写入
synchronous_commit = on
