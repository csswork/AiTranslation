<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"
     font-family="-apple-system, BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, sans-serif"
     role="img" aria-label="效果示意：网页上选中的一段外文，屏幕中央的弹窗里正在逐字显示中文译文">
  <title>AI 划词翻译 · 效果示意（浅色）</title>
  <!-- 与 preview.svg 同构，只换配色。实际产品弹窗没有背景压暗层，浅色版照实不画 -->

  <defs>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#2e3082" flood-opacity=".18"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfe" stop-opacity="0"/>
      <stop offset="1" stop-color="#fbfbfe" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- 页面底色 -->
  <rect width="800" height="500" fill="#fbfbfe"/>

  <!-- ============ 背后的网页：标题 + 正文，用色块示意 ============ -->
  <g fill="#16171f">
    <rect x="64" y="56" width="286" height="15" rx="7.5" opacity=".16"/>
    <rect x="64" y="82" width="150" height="9"  rx="4.5" opacity=".08"/>

    <rect x="64" y="126" width="620" height="10" rx="5" opacity=".09"/>
    <rect x="64" y="150" width="672" height="10" rx="5" opacity=".09"/>

    <!-- 被选中的那两行：强调色的选区底 -->
    <rect x="60" y="170" width="676" height="26" rx="5" fill="#5b5eea" opacity=".16"/>
    <rect x="60" y="196" width="382" height="26" rx="5" fill="#5b5eea" opacity=".16"/>
    <rect x="64" y="178" width="668" height="10" rx="5" opacity=".30"/>
    <rect x="64" y="204" width="370" height="10" rx="5" opacity=".30"/>

    <rect x="64" y="244" width="640" height="10" rx="5" opacity=".09"/>
    <rect x="64" y="268" width="672" height="10" rx="5" opacity=".09"/>
    <rect x="64" y="292" width="470" height="10" rx="5" opacity=".09"/>
    <rect x="64" y="332" width="610" height="10" rx="5" opacity=".06"/>
    <rect x="64" y="356" width="672" height="10" rx="5" opacity=".06"/>
    <rect x="64" y="380" width="300" height="10" rx="5" opacity=".06"/>
  </g>

  <rect x="0" y="300" width="800" height="200" fill="url(#fade)"/>

  <!-- ==================== 屏幕中央的译文弹窗 ==================== -->
  <g filter="url(#lift)">
    <rect x="168" y="132" width="464" height="236" rx="14" fill="#ffffff" stroke="#e2e2ee"/>

    <!-- 标题栏（实际可拖动） -->
    <rect x="168.5" y="132.5" width="463" height="41.5" rx="13.5" fill="#f4f4fa"/>
    <rect x="168.5" y="158" width="463" height="16" fill="#f4f4fa"/>
    <line x1="168" y1="174" x2="632" y2="174" stroke="#e6e6f0"/>
    <circle cx="192" cy="153" r="4.5" fill="#5b5eea"/>
    <text x="207" y="158" font-size="13" font-weight="600" fill="#16171f">翻译成中文</text>
    <rect x="556" y="147" width="40" height="13" rx="6.5" fill="#16171f" opacity=".07"/>
    <circle cx="612" cy="153" r="4" fill="#16171f" opacity=".22"/>

    <!-- 译文：逐字出现，末尾留一个光标 -->
    <text x="194" y="214" font-size="15.5" fill="#16171f">这个扩展只会发送你要求它翻译的</text>
    <text x="194" y="243" font-size="15.5" fill="#16171f">内容，并且只发往你自己选定的那</text>
    <text x="194" y="272" font-size="15.5" fill="#16171f">家平台</text>
    <rect x="248" y="259" width="2" height="17" fill="#5b5eea"/>

    <!-- 底部：原文折叠面板 + 操作 -->
    <line x1="194" y1="302" x2="606" y2="302" stroke="#ececf4"/>
    <path d="M196 319 l5 5 l5 -5" fill="none" stroke="#8a8fa3" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="214" y="324" font-size="11.5" fill="#666b82">原文</text>
    <rect x="516" y="310" width="42" height="17" rx="5" fill="#16171f" opacity=".06"/>
    <rect x="566" y="310" width="42" height="17" rx="5" fill="#16171f" opacity=".06"/>
  </g>
</svg>
